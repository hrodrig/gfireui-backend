# PR / develop / main: fail-closed quality gates + docker build (no push).
# Cover < 80% fails the job — no exceptions.
name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: gofmt + go vet + gocyclo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting (gofmt -s)
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "Run: make lint-fix"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Cyclomatic complexity (gocyclo)
        run: make gocyclo

  test:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./... -count=1

  cover:
    name: coverage ≥80% (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gfireui
          POSTGRES_PASSWORD: gfireui
          POSTGRES_DB: gfireui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gfireui -d gfireui"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cover (fail if below COVER_MIN_PERCENT)
        env:
          GFIREUI_BACKEND_TEST_DSN: postgres://gfireui:gfireui@127.0.0.1:5432/gfireui?sslmode=disable
          COVER_MIN_PERCENT: "80"
        run: |
          set -euo pipefail
          go test ./... -coverprofile=coverage.out -covermode=atomic -count=1
          total=$(go tool cover -func=coverage.out | tail -1)
          echo "$total"
          pct=$(echo "$total" | awk '{print $NF}' | tr -d '%')
          awk -v p="$pct" -v min="${COVER_MIN_PERCENT}" 'BEGIN {
            if ((p+0) < (min+0)) {
              printf "coverage %s%% must be >= %s%%\n", p, min
              exit 1
            }
          }'

      - name: Upload coverage.out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-out
          path: coverage.out
          if-no-files-found: ignore

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    needs: [lint, test, cover]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read VERSION
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gfireui-backend:ci
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
            BRANCH=${{ github.ref_name }}
            BUILDDATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
