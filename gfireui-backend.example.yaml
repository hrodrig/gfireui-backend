# ───────────────────────────────────────────────────────────
# GFireUI Backend configuration — copy to gfireui-backend.yaml
# and adjust.
#
# Environment overrides: any key can be set as GFIREUI_BACKEND_<PATH>
# with dots replaced by underscores. Examples:
#   GFIREUI_BACKEND_SERVER_ADDR=:8090
#   GFIREUI_BACKEND_DATABASE_DSN=postgres://gfireui:gfireui@localhost:5432/gfireui?sslmode=disable
#   GFIREUI_BACKEND_AUTH_JWT_SECRET=change-me
#   GFIREUI_BACKEND_GFIRE_BASE_URL=http://localhost:8080
#   GFIREUI_BACKEND_GFIRE_TOKEN=gfire-service-bearer
#   GFIREUI_BACKEND_BOOTSTRAP_ADMIN_EMAIL=admin@example.com
#
# Config file path: set GFIREUI_BACKEND_CONFIG or pass --config (future).
# Start:  gfireui-backend
# ───────────────────────────────────────────────────────────

# ── HTTP server ─────────────────────────────────────────────
server:
  # Listen address (host:port). Default :8090.
  addr: ":8090"

  # Comma-separated browser Origins allowed to call the BFF (CORS).
  # Empty = no CORS headers (curl / same-origin only).
  # Local SPA: http://127.0.0.1:5173,http://localhost:5173
  cors_allowed_origins: ""

# ── PostgreSQL (database gfireui) ───────────────────────────
database:
  # Full connection string (pgx format).
  dsn: "postgres://gfireui:gfireui@localhost:5432/gfireui?sslmode=disable"

# ── JWT authentication (browser sessions) ─────────────────
auth:
  # HS256 signing secret. Required in production.
  jwt_secret: ""

  # Access token lifetime. Default 24h.
  token_ttl: 24h

# ── Upstream GFire service ──────────────────────────────────
gfire:
  # GFire REST base URL (no trailing slash).
  base_url: "http://localhost:8080"

  # Service Bearer for GFire /v1/* (never sent to browser). Optional when
  # GFire auth is disabled; empty → proxy without Authorization header.
  token: ""

# ── Bootstrap Administrator (first boot only) ───────────────
# When the users table is empty and these are set, an Administrator
# account is created on startup. Prefer env in production.
bootstrap:
  admin_email: ""
  admin_password: ""
  admin_first_name: ""
  admin_last_name: ""
